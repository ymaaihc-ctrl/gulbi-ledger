<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>굴비 가계부</title>
  <meta name="description" content="천장의 굴비처럼 아끼면 보상이 쌓이는 자린고비 가계부">
  <meta name="theme-color" content="#f6efe2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1914" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="굴비 가계부">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>굴비 가계부</span>
      </div>
      <div class="topbar-right" id="topbar-right"></div>
    </header>

    <main>
      <section class="view" id="view-onboarding" hidden></section>
      <section class="view" id="view-home" hidden></section>
      <section class="view" id="view-ledger" hidden></section>
      <section class="view" id="view-rewards" hidden></section>
      <section class="view" id="view-settings" hidden></section>
    </main>

    <button class="fab" id="fab" type="button" aria-label="빠른 입력">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>

    <nav class="tabbar" id="tabbar" aria-label="메인 메뉴">
      <button type="button" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>굴비홈</span></button>
      <button type="button" data-tab="ledger"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h10l3 3v15H6zM9 9h7M9 13h7M9 17h4"/></svg><span>장부</span></button>
      <button type="button" data-tab="rewards"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.3 6.8 19.1l1-5.8L3.5 9.2l5.9-.8z"/></svg><span>보상</span></button>
      <button type="button" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>설정</span></button>
    </nav>
  </div>

  <dialog class="sheet" id="entry-sheet" aria-labelledby="entry-title"></dialog>
  <dialog class="modal" id="modal"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
